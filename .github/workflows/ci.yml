name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Style (no em or en dashes)
        run: npm run style
      - name: Types (JSDoc + TypeScript checker)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
